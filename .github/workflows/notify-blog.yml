name: Notify blog to sync

on:
  push:
    branches: [main]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger blog sync workflow
        run: |
          curl -sf -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.BLOG_PAT }}" \
            https://api.github.com/repos/LukeChou166/LukeChou166.github.io/dispatches \
            -d '{"event_type":"book-update"}'
